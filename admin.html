<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Genratetag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN UI -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel p-8 rounded-xl w-full max-w-md shadow-2xl flex flex-col gap-4 border-t-4 border-indigo-500">
            <div class="text-center mb-2">
                <i class="fas fa-tags text-5xl text-indigo-500 mb-2"></i>
                <h2 id="dynamicSiteName1" class="text-2xl font-bold text-white">Genratetag</h2>
            </div>
            <input type="email" id="emailInput" placeholder="Email Address" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none">
            <input type="password" id="passwordInput" placeholder="Password" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none" onkeypress="if(event.key === 'Enter') handleAuth()">
            <div id="authMessage" class="hidden text-center text-sm p-2 rounded"></div>
            <button onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg mt-2">Login / Register</button>
        </div>
    </div>

    <!-- MAIN APP UI -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg border-b-2 border-indigo-500">
            <div class="flex items-center gap-2 text-xl font-bold text-indigo-500">
                <i class="fas fa-tags"></i> <span id="dynamicSiteName2" class="text-white">Genratetag</span>
            </div>
            <div class="flex gap-2">
                <button onclick="showHome()" class="bg-slate-700 px-4 py-2 rounded text-sm font-semibold hover:bg-slate-600 transition">Home</button>
                <button onclick="showHistory()" class="bg-indigo-600 px-4 py-2 rounded text-sm font-semibold hover:bg-indigo-500 transition">History</button>
                <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-500 transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="flex-grow p-6 max-w-6xl mx-auto w-full flex flex-col gap-6">
            <section id="historySection" class="hidden glass-panel p-6 rounded-xl">
                <h2 class="text-2xl font-bold mb-4">Cloud History</h2>
                <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </section>

            <section id="uploadSection" class="glass-panel p-10 rounded-xl text-center border-dashed border-2 border-slate-600 hover:border-indigo-500 transition cursor-pointer flex flex-col items-center justify-center min-h-[300px]">
                <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
                <i class="fas fa-cloud-upload-alt text-5xl text-indigo-400 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Upload Video for Metadata</h2>
                <p class="text-slate-400 mb-4 text-sm">Select any MP4, WebM or MKV file.</p>
                <button onclick="document.getElementById('videoInput').click()" id="dynamicUploadBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-lg font-bold mt-4 transition">Select Video File</button>
            </section>

            <video id="hiddenVideo" class="hidden" preload="metadata" crossorigin="anonymous"></video>
            <canvas id="hiddenCanvas" class="hidden"></canvas>
            
            <div id="loadingIndicator" class="hidden text-center py-10 flex flex-col items-center">
                <i class="fas fa-brain fa-spin text-4xl text-indigo-500 mb-3"></i>
                <p class="text-lg text-slate-300 font-semibold" id="loadingText">Processing...</p>
            </div>

            <div id="resultsSection" class="hidden flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex flex-col gap-4">
                    <img id="historyPreviewImg" class="w-full rounded-lg mb-2 hidden" />
                    <canvas id="thumbnailCanvas" class="w-full rounded-lg bg-black"></canvas>
                    <button onclick="downloadThumbnail()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded font-bold transition"><i class="fas fa-download"></i> Download Thumbnail</button>
                </div>
                <div class="w-full md:w-2/3 flex flex-col gap-4">
                    <div>
                        <label class="text-sm font-semibold text-slate-400">YouTube Title</label>
                        <input type="text" id="resTitle" class="w-full bg-slate-800 border rounded px-3 py-2 font-bold text-lg border-slate-600 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-400">Description</label>
                        <textarea id="resDesc" rows="5" class="w-full bg-slate-800 border rounded px-3 py-2 border-slate-600 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-400">Tags</label>
                        <textarea id="resTags" rows="2" class="w-full bg-slate-800 border rounded px-3 py-2 border-slate-600 focus:outline-none focus:border-indigo-500 text-indigo-400"></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEJaT600Z1rIbMeduSp4PV1LwpQi1QLWY",
            authDomain: "genratetag-7f9ae.firebaseapp.com",
            projectId: "genratetag-7f9ae",
            storageBucket: "genratetag-7f9ae.firebasestorage.app",
            messagingSenderId: "538331491651",
            appId: "1:538331491651:web:bbb66e84dd3d7ded4a53f6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // STRICTLY NO LOCAL STORAGE - Kept in volatile memory
        let activeUserSession = null; 

        // Fetch UI Config from Admin Panel dynamically on load
        db.collection("admin_settings").doc("ui_config").get().then(doc => {
            if(doc.exists) {
                const data = doc.data();
                if(data.siteName) {
                    document.getElementById('pageTitle').innerText = data.siteName;
                    document.getElementById('dynamicSiteName1').innerText = data.siteName;
                    document.getElementById('dynamicSiteName2').innerText = data.siteName;
                }
                if(data.btnName) document.getElementById('dynamicUploadBtn').innerText = data.btnName;
            }
        });

        async function handleAuth() {
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("Enter credentials");

            const userRef = db.collection("users").doc(email);
            const doc = await userRef.get();

            if (!doc.exists) {
                await userRef.set({ email, password, createdAt: new Date().toISOString() });
                alert("Account Created! You are logged in.");
            } else {
                if (doc.data().password !== password) return alert("Wrong password!");
            }
            
            activeUserSession = email; // Save to Memory ONLY
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById("uploadSection").classList.remove("hidden");
        }

        function logout() {
            activeUserSession = null; // Clear memory
            document.getElementById('emailInput').value = "";
            document.getElementById('passwordInput').value = "";
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }

        function showHome() {
            document.getElementById("historySection").classList.add("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            document.getElementById("uploadSection").classList.remove("hidden");
        }

        async function showHistory() {
            document.getElementById("uploadSection").classList.add("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            document.getElementById("historySection").classList.remove("hidden");
            
            const grid = document.getElementById("historyGrid");
            grid.innerHTML = '<div class="col-span-full text-center text-slate-400">Loading...</div>';
            
            const snapshot = await db.collection("users").doc(activeUserSession).collection("history").orderBy("timestamp", "desc").limit(12).get();
            grid.innerHTML = "";
            
            if(snapshot.empty) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400">No history found.</div>';
                return;
            }

            snapshot.forEach(doc => {
                const item = doc.data();
                grid.innerHTML += `<div class="glass-panel p-3 rounded cursor-pointer hover:border-indigo-500 transition border border-transparent" onclick='loadHistoryItem(${JSON.stringify(item.title).replace(/'/g, "&apos;")}, ${JSON.stringify(item.desc).replace(/'/g, "&apos;")}, ${JSON.stringify(item.tags).replace(/'/g, "&apos;")}, "${item.image}")'>
                    <img src="${item.image}" class="w-full h-32 object-cover rounded mb-2"><p class="text-sm font-semibold truncate">${item.title}</p>
                </div>`;
            });
        }

        function loadHistoryItem(title, desc, tags, image) {
            document.getElementById("historySection").classList.add("hidden");
            document.getElementById("resultsSection").classList.remove("hidden");
            
            document.getElementById("resTitle").value = title;
            document.getElementById("resDesc").value = desc;
            document.getElementById("resTags").value = tags;
            
            const histImg = document.getElementById("historyPreviewImg");
            histImg.src = image;
            histImg.classList.remove("hidden");
            document.getElementById("thumbnailCanvas").classList.add("hidden");
        }

        async function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("uploadSection").classList.add("hidden");
            document.getElementById("loadingIndicator").classList.remove("hidden");
            document.getElementById("historyPreviewImg").classList.add("hidden");
            document.getElementById("thumbnailCanvas").classList.remove("hidden");

            // Fetch API Key strictly from cloud (No local storage)
            const adminDoc = await db.collection("admin_settings").doc("api_config").get();
            if(!adminDoc.exists || !adminDoc.data().gemini_key) {
                alert("Admin has not set the API key yet!"); 
                showHome();
                return;
            }
            const apiKey = adminDoc.data().gemini_key;

            const videoURL = URL.createObjectURL(file);
            const hiddenVid = document.getElementById("hiddenVideo");
            hiddenVid.src = videoURL;
            
            hiddenVid.onloadedmetadata = () => { hiddenVid.currentTime = Math.min(2, hiddenVid.duration * 0.2); };
            hiddenVid.onseeked = async () => {
                document.getElementById("loadingText").innerText = "Extracting frame & analyzing AI...";
                const canvas = document.getElementById("hiddenCanvas");
                canvas.width = 1280; canvas.height = 720;
                canvas.getContext("2d").drawImage(hiddenVid, 0, 0, 1280, 720);
                const b64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
                
                const prompt = `You are a YouTube SEO expert. Generate JSON: {"title": "Catchy Title", "description": "SEO Desc", "tags": "tag1, tag2", "thumbText": "SHORT BOLD"}`;
                
                // FIXED API URL: Changed v1 to v1beta
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                try {
                    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] }) });
                    const data = await res.json();
                    
                    if(data.error) {
                        alert("AI Error: " + data.error.message);
                        showHome(); return;
                    }
                    
                    let textRes = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                    let json = JSON.parse(textRes);
                    
                    document.getElementById("resTitle").value = json.title || "";
                    document.getElementById("resDesc").value = json.description || "";
                    document.getElementById("resTags").value = json.tags || "";
                    
                    createThumbnail(json.thumbText || json.title);
                    
                    document.getElementById("loadingIndicator").classList.add("hidden");
                    document.getElementById("resultsSection").classList.remove("hidden");
                    
                    // Save to Firebase immediately
                    setTimeout(() => {
                        db.collection("users").doc(activeUserSession).collection("history").add({
                            title: json.title, desc: json.description, tags: json.tags, image: document.getElementById("thumbnailCanvas").toDataURL("image/jpeg", 0.5), timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }, 500);

                } catch(e) {
                    alert("Network or Processing Error. Please try again.");
                    showHome();
                }
            };
        }

        function createThumbnail(mainText) {
            const canvas = document.getElementById("thumbnailCanvas");
            const hiddenCanvas = document.getElementById("hiddenCanvas");
            canvas.width = 1280; canvas.height = 720;
            const ctx = canvas.getContext("2d");
            
            ctx.drawImage(hiddenCanvas, 0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "rgba(0,0,0,0.3)");
            gradient.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = gradient; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center"; 
            ctx.font = "900 65px 'Inter', sans-serif";
            
            const words = (mainText || "AWESOME VIDEO").toUpperCase().split(' ');
            let line = ''; let lines = [];
            for(let i = 0; i < words.length; i++) {
                let testLine = line + words[i] + ' ';
                if(ctx.measureText(testLine).width > canvas.width - 200 && i > 0) {
                    lines.push(line); line = words[i] + ' ';
                } else { line = testLine; }
            }
            lines.push(line);

            let startY = canvas.height - (lines.length * 80) - 40;
            lines.forEach((l, idx) => {
                let textY = startY + (idx * 80);
                ctx.lineWidth = 12; ctx.strokeStyle = "black"; ctx.fillStyle = idx === 1 ? "#38bdf8" : "white";
                ctx.strokeText(l.trim(), canvas.width/2, textY);
                ctx.fillText(l.trim(), canvas.width/2, textY);
            });
        }

        function downloadThumbnail() {
            const link = document.createElement("a");
            link.download = "youtube-thumbnail.jpg";
            link.href = document.getElementById("thumbnailCanvas").toDataURL("image/jpeg", 0.95);
            link.click();
        }
    </script>
</body>
</html>
