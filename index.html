<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title id="pageTitle"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="initialLoader" class="min-h-screen flex items-center justify-center">
        <i class="fas fa-circle-notch fa-spin text-5xl text-indigo-500"></i>
    </div>

    <div id="authSection" class="hidden min-h-screen items-center justify-center p-6">
        <div class="glass-panel p-8 rounded-xl w-full max-w-md shadow-2xl flex flex-col gap-4 border-t-4 border-indigo-500">
            <div class="text-center mb-2">
                <i class="fas fa-tags text-5xl text-indigo-500 mb-2"></i>
                <h2 id="dynamicSiteName1" class="text-2xl font-bold text-white transition-opacity duration-300">Genratetag</h2>
            </div>
            
            <input type="email" id="emailInput" placeholder="Email Address" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
            <input type="password" id="passwordInput" placeholder="Password" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none focus:border-indigo-500 transition" onkeypress="if(event.key === 'Enter') handleLogin()">
            
            <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg mt-2 transition shadow-lg">Login</button>
            
            <div class="flex items-center my-1">
                <div class="flex-grow border-t border-slate-600"></div>
                <span class="px-3 text-slate-400 text-xs uppercase font-semibold">Or</span>
                <div class="flex-grow border-t border-slate-600"></div>
            </div>
            
            <button onclick="handleRegister()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition shadow-lg">Register Account</button>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen flex-col">
        <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg border-b-2 border-indigo-500">
            <div class="flex items-center gap-2 text-xl font-bold text-indigo-500">
                <i class="fas fa-tags"></i> <span id="dynamicSiteName2" class="text-white">Genratetag</span>
            </div>
            <div class="flex gap-2">
                <button onclick="showHome()" class="bg-slate-700 px-4 py-2 rounded text-sm font-semibold hover:bg-slate-600 transition">Home</button>
                <button onclick="showHistory()" class="bg-indigo-600 px-4 py-2 rounded text-sm font-semibold hover:bg-indigo-500 transition">History</button>
                <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded text-sm hover:bg-red-500 transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="flex-grow p-6 max-w-6xl mx-auto w-full flex flex-col gap-6">
            <section id="historySection" class="hidden glass-panel p-6 rounded-xl">
                <h2 class="text-2xl font-bold mb-4">Cloud History</h2>
                <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </section>

            <section id="uploadSection" class="glass-panel p-10 rounded-xl text-center border-dashed border-2 border-slate-600 hover:border-indigo-500 transition cursor-pointer flex flex-col items-center justify-center min-h-[300px]">
                <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
                <i class="fas fa-cloud-upload-alt text-5xl text-indigo-400 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Upload Video for Viral Metadata</h2>
                <button onclick="document.getElementById('videoInput').click()" id="dynamicUploadBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-lg font-bold mt-4 transition">Select Video File</button>
            </section>

            <video id="hiddenVideo" class="hidden" preload="metadata" crossorigin="anonymous"></video>
            <canvas id="hiddenCanvas" class="hidden"></canvas>
            
            <div id="loadingIndicator" class="hidden text-center py-10 flex flex-col items-center">
                <i class="fas fa-brain fa-spin text-4xl text-indigo-500 mb-3"></i>
                <p class="text-lg text-slate-300 font-semibold" id="loadingText">AI is generating viral SEO data...</p>
            </div>

            <div id="resultsSection" class="hidden flex flex-col gap-6">
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 flex flex-col gap-4">
                        <img id="historyPreviewImg" class="w-full rounded-lg mb-2 hidden shadow-lg" />
                        <canvas id="thumbnailCanvas" class="w-full rounded-lg bg-black shadow-lg"></canvas>
                        <button onclick="downloadThumbnail()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded font-bold transition shadow-lg"><i class="fas fa-download"></i> Download Thumbnail</button>
                    </div>
                    
                    <div class="w-full md:w-2/3 flex flex-col gap-4">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-sm font-semibold text-slate-400">Viral YouTube Title</label>
                                <button onclick="copyToClipboard('resTitle')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded transition"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                            <input type="text" id="resTitle" readonly class="w-full bg-slate-900 border rounded px-3 py-2 font-bold text-lg border-slate-700 text-slate-300 cursor-not-allowed focus:outline-none">
                        </div>
                        
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-sm font-semibold text-slate-400">SEO Optimized Description</label>
                                <button onclick="copyToClipboard('resDesc')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded transition"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                            <textarea id="resDesc" rows="5" readonly class="w-full bg-slate-900 border rounded px-3 py-2 border-slate-700 text-slate-300 cursor-not-allowed focus:outline-none"></textarea>
                        </div>
                        
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-sm font-semibold text-slate-400">Viral Tags</label>
                                <button onclick="copyToClipboard('resTags')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded transition"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                            <textarea id="resTags" rows="2" readonly class="w-full bg-slate-900 border rounded px-3 py-2 border-slate-700 text-indigo-400 cursor-not-allowed focus:outline-none font-medium"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Chat Section -->
                <div class="w-full glass-panel p-6 rounded-xl mt-4 border-t-4 border-pink-500 shadow-xl">
                    <h3 class="text-lg font-bold text-white mb-4"><i class="fas fa-robot text-pink-400 mr-2"></i> Chat with Gemini AI (YouTube Guru)</h3>
                    
                    <div id="chatHistory" class="bg-slate-900 w-full h-48 rounded-lg p-4 mb-4 overflow-y-auto flex flex-col gap-3 text-sm border border-slate-700">
                        <div class="text-left">
                            <span class="bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2 rounded-lg inline-block rounded-tl-none">
                                Hello! Ask me anything about growing your channel, getting more views, or how to use these viral tags!
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex gap-2">
                        <input type="text" id="chatInput" placeholder="Type your message here..." class="flex-grow bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-pink-500 text-white" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()" class="bg-pink-600 hover:bg-pink-500 text-white px-6 py-3 rounded-lg font-bold transition shadow-lg"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-green-500 text-white px-6 py-3 rounded shadow-lg font-bold transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        Copied to clipboard!
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEJaT600Z1rIbMeduSp4PV1LwpQi1QLWY",
            authDomain: "genratetag-7f9ae.firebaseapp.com",
            projectId: "genratetag-7f9ae",
            storageBucket: "genratetag-7f9ae.firebasestorage.app",
            messagingSenderId: "538331491651",
            appId: "1:538331491651:web:bbb66e84dd3d7ded4a53f6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeUserSession = localStorage.getItem("genratetag_session") || null;
        let globalApiKey = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            db.collection("admin_settings").doc("ui_config").get().then(doc => {
                const siteTitle = document.getElementById('dynamicSiteName1');
                if(doc.exists) {
                    const data = doc.data();
                    const name = data.siteName || "Genratetag";
                    document.getElementById('pageTitle').innerText = name;
                    siteTitle.innerText = name;
                    document.getElementById('dynamicSiteName2').innerText = name;
                    document.getElementById('dynamicUploadBtn').innerText = data.btnName || "Upload Video";
                }
                
                document.getElementById('initialLoader').classList.add('hidden');
                
                if (activeUserSession) {
                    document.getElementById('mainApp').style.display = 'flex';
                    document.getElementById("uploadSection").classList.remove("hidden");
                } else {
                    document.getElementById('authSection').style.display = 'flex';
                }
            }).catch(() => {
                document.getElementById('initialLoader').classList.add('hidden');
                document.getElementById('authSection').style.display = 'flex';
            });
        });

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            
            const toast = document.getElementById("toast");
            toast.classList.remove("opacity-0");
            setTimeout(() => { toast.classList.add("opacity-0"); }, 2000);
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("⚠️ Please enter Email and Password");

            try {
                const doc = await db.collection("users").doc(email).get();
                if (!doc.exists) return alert("❌ Account not found! Please click 'Register Account' first.");
                if (doc.data().password !== password) return alert("❌ Wrong password!");
                
                activeUserSession = email; 
                localStorage.setItem("genratetag_session", email);
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById("uploadSection").classList.remove("hidden");
            } catch(e) {
                alert("Database error. Please try again.");
            }
        }

        async function handleRegister() {
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value.trim();
            if (!email || !password) return alert("⚠️ Please enter Email and Password to register");

            try {
                const userRef = db.collection("users").doc(email);
                const doc = await userRef.get();

                if (doc.exists) return alert("⚠️ This Email is already registered! Please click 'Login' instead.");
                
                await userRef.set({ email, password, createdAt: new Date().toISOString() });
                alert("✅ Account created successfully! You are now logged in.");
                
                activeUserSession = email; 
                localStorage.setItem("genratetag_session", email);
                
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById("uploadSection").classList.remove("hidden");
            } catch(e) {
                alert("Database error. Please try again.");
            }
        }

        function logout() {
            activeUserSession = null; 
            localStorage.removeItem("genratetag_session");
            
            document.getElementById('emailInput').value = "";
            document.getElementById('passwordInput').value = "";
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
        }

        function showHome() {
            document.getElementById("historySection").classList.add("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            document.getElementById("uploadSection").classList.remove("hidden");
        }

        async function showHistory() {
            document.getElementById("uploadSection").classList.add("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            document.getElementById("historySection").classList.remove("hidden");
            
            const grid = document.getElementById("historyGrid");
            grid.innerHTML = '<div class="col-span-full text-center text-slate-400">Loading...</div>';
            
            try {
                const snapshot = await db.collection("users").doc(activeUserSession).collection("history").orderBy("timestamp", "desc").limit(12).get();
                grid.innerHTML = "";
                
                if(snapshot.empty) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-400">No history found.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const item = doc.data();
                    grid.innerHTML += `<div class="glass-panel p-3 rounded cursor-pointer hover:border-indigo-500 transition border border-transparent" onclick='loadHistoryItem(${JSON.stringify(item.title).replace(/'/g, "&apos;")}, ${JSON.stringify(item.desc).replace(/'/g, "&apos;")}, ${JSON.stringify(item.tags).replace(/'/g, "&apos;")}, "${item.image}")'>
                        <img src="${item.image}" class="w-full h-32 object-cover rounded mb-2"><p class="text-sm font-semibold truncate">${item.title}</p>
                    </div>`;
                });
            } catch (e) {
                grid.innerHTML = '<div class="col-span-full text-center text-red-400">Error loading history.</div>';
            }
        }

        function loadHistoryItem(title, desc, tags, image) {
            document.getElementById("historySection").classList.add("hidden");
            document.getElementById("resultsSection").classList.remove("hidden");
            
            document.getElementById("resTitle").value = title;
            document.getElementById("resDesc").value = desc;
            document.getElementById("resTags").value = tags;
            
            const histImg = document.getElementById("historyPreviewImg");
            histImg.src = image;
            histImg.classList.remove("hidden");
            document.getElementById("thumbnailCanvas").classList.add("hidden");
        }

        async function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("uploadSection").classList.add("hidden");
            document.getElementById("loadingIndicator").classList.remove("hidden");
            document.getElementById("historyPreviewImg").classList.add("hidden");
            document.getElementById("thumbnailCanvas").classList.remove("hidden");

            try {
                const adminDoc = await db.collection("admin_settings").doc("api_config").get();
                if(!adminDoc.exists || !adminDoc.data().gemini_key) {
                    alert("Admin has not set the API key yet!"); 
                    showHome();
                    return;
                }
                globalApiKey = adminDoc.data().gemini_key; 

                const videoURL = URL.createObjectURL(file);
                const hiddenVid = document.getElementById("hiddenVideo");
                hiddenVid.src = videoURL;
                
                hiddenVid.onloadedmetadata = () => { hiddenVid.currentTime = Math.min(2, hiddenVid.duration * 0.2); };
                hiddenVid.onseeked = async () => {
                    document.getElementById("loadingText").innerText = "Generating Metadata... Please wait.";
                    const canvas = document.getElementById("hiddenCanvas");
                    canvas.width = 1280; canvas.height = 720;
                    canvas.getContext("2d").drawImage(hiddenVid, 0, 0, 1280, 720);
                    const b64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
                    
                    const prompt = `You are a highly skilled viral YouTube SEO expert. Analyze this image from a video. Generate a highly engaging, clickbaity but accurate JSON format ONLY: {"title": "Viral Catchy Title Here", "description": "SEO optimized description packed with high ranking keywords and hashtags to maximize reach", "tags": "viral, trending, ranking tag 1, ranking tag 2...", "thumbText": "SHORT BOLD"}`;
                    
                    // FIXED: Using universally supported gemini-1.5-flash-latest on v1beta
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${globalApiKey}`;
                    
                    try {
                        const res = await fetch(url, { 
                            method: "POST", 
                            headers: { "Content-Type": "application/json" }, 
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] }) 
                        });
                        const data = await res.json();
                        
                        if(data.error) {
                            alert("API Error: " + data.error.message);
                            showHome(); return;
                        }
                        
                        let textRes = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                        let json = JSON.parse(textRes);
                        
                        document.getElementById("resTitle").value = json.title || "";
                        document.getElementById("resDesc").value = json.description || "";
                        document.getElementById("resTags").value = json.tags || "";
                        
                        createThumbnail(json.thumbText || json.title);
                        
                        document.getElementById("loadingIndicator").classList.add("hidden");
                        document.getElementById("resultsSection").classList.remove("hidden");
                        
                        setTimeout(() => {
                            db.collection("users").doc(activeUserSession).collection("history").add({
                                title: json.title, desc: json.description, tags: json.tags, image: document.getElementById("thumbnailCanvas").toDataURL("image/jpeg", 0.5), timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }, 500);

                    } catch(e) {
                        alert("Network Error. Please try again.");
                        showHome();
                    }
                };
            } catch (e) {
                alert("Failed to connect to configuration database.");
                showHome();
            }
        }

        async function sendChatMessage() {
            const inputEl = document.getElementById("chatInput");
            const msg = inputEl.value.trim();
            if(!msg) return; 

            if (!globalApiKey) {
                try {
                    const adminDoc = await db.collection("admin_settings").doc("api_config").get();
                    if(adminDoc.exists && adminDoc.data().gemini_key) {
                        globalApiKey = adminDoc.data().gemini_key;
                    } else {
                        alert("Error: Admin API Key is missing. Please contact Admin.");
                        return;
                    }
                } catch(e) {
                    alert("Database Error: Could not load API Key.");
                    return;
                }
            }

            const chatHistory = document.getElementById("chatHistory");
            
            chatHistory.innerHTML += `
                <div class="text-right">
                    <span class="bg-indigo-600 text-white px-4 py-2 rounded-lg inline-block rounded-tr-none shadow">${msg}</span>
                </div>`;
            inputEl.value = "";
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const typingId = "typing-" + Date.now();
            chatHistory.innerHTML += `<div id="${typingId}" class="text-left text-xs text-pink-400 mt-1 italic"><i class="fas fa-spinner fa-spin"></i> AI soch raha hai...</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // FIXED: Using universally supported gemini-pro on v1beta for chat
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${globalApiKey}`;
            
            try {
                const res = await fetch(url, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: `You are a YouTube Guru helping a creator. Keep it short and helpful. User says: ${msg}` }] }] }) 
                });
                const data = await res.json();
                
                document.getElementById(typingId).remove();

                if(!data.error && data.candidates) {
                    let reply = data.candidates[0].content.parts[0].text;
                    chatHistory.innerHTML += `
                        <div class="text-left">
                            <span class="bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2 rounded-lg inline-block rounded-tl-none shadow mt-2">
                                ${reply.replace(/\n/g, '<br>')}
                            </span>
                        </div>`;
                } else {
                    chatHistory.innerHTML += `<div class="text-center text-red-400 text-xs mt-2">API Error: ${data.error.message}</div>`;
                }
            } catch(e) {
                document.getElementById(typingId)?.remove();
                chatHistory.innerHTML += `<div class="text-center text-red-400 text-xs mt-2">Network Error. Failed to reach Google API.</div>`;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function createThumbnail(mainText) {
            const canvas = document.getElementById("thumbnailCanvas");
            const hiddenCanvas = document.getElementById("hiddenCanvas");
            canvas.width = 1280; canvas.height = 720;
            const ctx = canvas.getContext("2d");
            
            ctx.drawImage(hiddenCanvas, 0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "rgba(0,0,0,0.3)");
            gradient.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = gradient; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center"; 
            ctx.font = "900 65px 'Inter', sans-serif";
            
            const words = (mainText || "AWESOME VIDEO").toUpperCase().split(' ');
            let line = ''; let lines = [];
            for(let i = 0; i < words.length; i++) {
                let testLine = line + words[i] + ' ';
                if(ctx.measureText(testLine).width > canvas.width - 200 && i > 0) {
                    lines.push(line); line = words[i] + ' ';
                } else { line = testLine; }
            }
            lines.push(line);

            let startY = canvas.height - (lines.length * 80) - 40;
            lines.forEach((l, idx) => {
                let textY = startY + (idx * 80);
                ctx.lineWidth = 12; ctx.strokeStyle = "black"; ctx.fillStyle = idx === 1 ? "#38bdf8" : "white";
                ctx.strokeText(l.trim(), canvas.width/2, textY);
                ctx.fillText(l.trim(), canvas.width/2, textY);
            });
        }

        function downloadThumbnail() {
            const link = document.createElement("a");
            link.download = "viral-youtube-thumbnail.jpg";
            link.href = document.getElementById("thumbnailCanvas").toDataURL("image/jpeg", 0.95);
            link.click();
        }
    </script>
</body>
</html>
