<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeGenius AI v12.0 - Thumbnail Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <!-- AUTHENTICATION SECTION -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel p-8 rounded-xl w-full max-w-md shadow-2xl flex flex-col gap-5 border-t-4 border-t-emerald-500">
            <div class="text-center mb-2">
                <i class="fab fa-youtube text-5xl text-red-500 mb-4 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]"></i>
                <h2 id="authTitle" class="text-2xl font-bold text-white">TubeGenius <span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded ml-2">v12.0</span></h2>
                <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Please login to continue.</p>
            </div>
            
            <div class="flex flex-col gap-4">
                <input type="email" id="emailInput" placeholder="Email Address" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none focus:border-emerald-500 transition">
                <input type="password" id="passwordInput" placeholder="Password" class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 focus:outline-none focus:border-emerald-500 transition" onkeypress="if(event.key === 'Enter') handleAuth()">
                
                <div id="authMessage" class="hidden text-center text-sm font-semibold p-2 rounded"></div>

                <button id="authBtn" onclick="handleAuth()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition mt-2">Login</button>
            </div>
            <div class="text-center text-sm text-slate-400 mt-2" id="authSwitchText">
                Don't have an account? <span class="text-emerald-400 cursor-pointer hover:underline font-semibold" onclick="toggleAuthMode()">Register here</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg border-b-2 border-b-emerald-500 flex-wrap gap-4">
            <div class="flex items-center gap-2 text-xl font-bold text-red-500">
                <i class="fab fa-youtube"></i>
                <span class="text-white">TubeGenius <span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded ml-1">v12.0</span></span>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <select id="modelSelect" class="bg-slate-800 text-sm px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-emerald-500 text-emerald-300 font-semibold max-w-[180px]">
                    <option value="waiting">Awaiting API Key...</option>
                </select>
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key..." class="bg-slate-800 text-sm px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-emerald-500 w-32 md:w-48">
                <button onclick="saveApiKey()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm transition">Save Key</button>
                <button onclick="logout()" class="bg-slate-700 text-white px-3 py-1.5 rounded text-sm transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="flex-grow p-6 max-w-6xl mx-auto w-full flex flex-col gap-6">
            <section id="uploadSection" class="glass-panel p-10 rounded-xl text-center border-dashed border-2 border-slate-600 hover:border-emerald-500 transition cursor-pointer flex flex-col items-center justify-center min-h-[300px]">
                <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
                <i class="fas fa-image text-5xl text-emerald-400 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Upload Video (HD Thumbnail Mode)</h2>
                <button onclick="document.getElementById('videoInput').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-lg font-bold shadow-lg transition mt-4">Select Video</button>
            </section>

            <!-- Hidden canvas to store the extracted frame data -->
            <canvas id="hiddenCanvas" class="hidden"></canvas>

            <div id="loadingIndicator" class="hidden text-center py-10 flex flex-col items-center">
                <i class="fas fa-circle-notch fa-spin text-4xl text-emerald-500 mb-3"></i>
                <p class="text-lg text-slate-300 font-semibold" id="loadingText">Processing...</p>
            </div>

            <div id="resultsSection" class="hidden flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex flex-col gap-6">
                    <div class="glass-panel p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-slate-400 mb-2 uppercase">Preview</h3>
                        <video id="previewVideo" controls class="w-full rounded-lg bg-black"></video>
                    </div>
                    <div class="glass-panel p-4 rounded-xl flex flex-col items-center">
                        <h3 class="text-sm font-semibold text-slate-400 mb-2 w-full text-left uppercase">Thumbnail</h3>
                        <canvas id="thumbnailCanvas" class="w-full rounded-lg mb-4 bg-black"></canvas>
                        <button onclick="downloadThumbnail()" class="w-full bg-emerald-600 text-white px-4 py-2 rounded font-bold"><i class="fas fa-download"></i> Download Thumbnail</button>
                    </div>
                </div>
                <div class="w-full md:w-2/3 flex flex-col gap-6">
                    <div class="glass-panel p-6 rounded-xl flex flex-col gap-4">
                        <label class="text-sm font-semibold text-slate-400">YouTube Title</label>
                        <input type="text" id="resTitle" class="w-full bg-slate-800 border rounded px-3 py-2 font-bold text-lg">
                        <label class="text-sm font-semibold text-slate-400">Description</label>
                        <textarea id="resDesc" rows="6" class="w-full bg-slate-800 border rounded px-3 py-2"></textarea>
                        <label class="text-sm font-semibold text-slate-400">Tags</label>
                        <textarea id="resTags" rows="2" class="w-full bg-slate-800 border rounded px-3 py-2 text-sm text-blue-400"></textarea>
                    </div>
                    <div class="glass-panel p-6 rounded-xl flex flex-col">
                        <h3 class="font-bold mb-2 text-slate-300">Refine Results</h3>
                        <div class="flex gap-2">
                            <input type="text" id="chatInput" placeholder="Make the title more catchy..." class="flex-grow bg-slate-800 border rounded-l px-4 py-2" onkeypress="if(event.key === 'Enter') refineMetadata()">
                            <button onclick="refineMetadata()" class="bg-emerald-600 text-white px-6 py-2 rounded-r font-bold">Update</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let isLoginMode = true;

        document.addEventListener("DOMContentLoaded", () => {
            const currentUser = localStorage.getItem("currentUser");
            if (currentUser) showMainApp(currentUser);
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                fetchAvailableModels(savedKey);
            }
        });

        function showAuthMessage(msg, type) {
            const msgBox = document.getElementById('authMessage');
            if(!msg) { msgBox.classList.add('hidden'); return; }
            msgBox.innerHTML = msg;
            msgBox.className = type === 'error' 
                ? "text-center text-sm font-semibold p-2 rounded bg-red-900/50 text-red-400 border border-red-500 mt-2" 
                : "text-center text-sm font-semibold p-2 rounded bg-green-900/50 text-green-400 border border-green-500 mt-2";
            msgBox.classList.remove('hidden');
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerHTML = isLoginMode ? 'TubeGenius <span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded ml-2">v12.0</span>' : 'Create Account <span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded ml-2">v12.0</span>';
            document.getElementById('authSubtitle').innerText = isLoginMode ? 'Please login to continue.' : 'Create a brand new account.';
            document.getElementById('authBtn').innerText = isLoginMode ? 'Login' : 'Register';
            
            document.getElementById('authSwitchText').innerHTML = isLoginMode 
                ? 'Don\'t have an account? <span class="text-emerald-400 cursor-pointer hover:underline font-semibold" onclick="toggleAuthMode()">Register here</span>'
                : 'Already have an account? <span class="text-emerald-400 cursor-pointer hover:underline font-semibold" onclick="toggleAuthMode()">Login here</span>';
            
            showAuthMessage(""); 
        }

        function handleAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            if (!email || !password) return showAuthMessage("⚠️ Please enter both email and password!", "error");

            let users = JSON.parse(localStorage.getItem('tubegenius_users') || '[]');
            
            if (isLoginMode) {
                if (users.find(u => u.email === email && u.password === password)) {
                    showAuthMessage("✅ Logging in...", "success");
                    localStorage.setItem('currentUser', email); 
                    setTimeout(() => showMainApp(email), 500);
                } else {
                    showAuthMessage("❌ Invalid credentials! Please click 'Register here' to create an account first.", "error");
                }
            } else {
                if(users.find(u => u.email === email)) {
                    return showAuthMessage("⚠️ Email already registered! Please switch to Login.", "error");
                }
                users.push({ email, password });
                localStorage.setItem('tubegenius_users', JSON.stringify(users));
                showAuthMessage("✅ Registered successfully! You can now login.", "success");
                setTimeout(() => toggleAuthMode(), 1500);
            }
        }

        function showMainApp(email) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('emailInput').value = "";
            document.getElementById('passwordInput').value = "";
            showAuthMessage("");
        }

        async function fetchAvailableModels(apiKey) {
            const selectEl = document.getElementById("modelSelect");
            selectEl.innerHTML = `<option value="waiting">Finding models...</option>`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const data = await response.json();
                
                if (data.error) {
                    selectEl.innerHTML = `<option value="waiting">Invalid API Key</option>`;
                    return null;
                }
                
                selectEl.innerHTML = "";
                const validModels = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));

                if (validModels.length === 0) {
                    selectEl.innerHTML = `<option value="waiting">No access</option>`;
                    return null;
                }

                validModels.forEach(m => {
                    const opt = document.createElement("option");
                    opt.value = m.name; 
                    opt.textContent = m.name.replace("models/", "");
                    selectEl.appendChild(opt);
                });

                let defaultModel = Array.from(selectEl.options).find(opt => opt.value.includes("flash"));
                if (defaultModel) { selectEl.value = defaultModel.value; return defaultModel.value; }
                return selectEl.options[0].value;
            } catch (err) {
                selectEl.innerHTML = `<option value="waiting">Network Error</option>`;
                return null;
            }
        }

        async function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value;
            if(!key) { alert("Enter API key!"); return; }
            localStorage.setItem("gemini_api_key", key);
            document.getElementById("modelSelect").innerHTML = `<option value="waiting">Finding models...</option>`;
            await fetchAvailableModels(key);
            alert("API Key saved successfully!");
        }

        function resetUI() {
            document.getElementById("loadingIndicator").classList.add("hidden");
            document.getElementById("uploadSection").classList.remove("hidden");
        }

        let currentImageBase64 = "";

        async function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value;
            if (!apiKey) return alert("Please put your Gemini API Key in the box at the top right.");

            document.getElementById("uploadSection").classList.add("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            document.getElementById("loadingIndicator").classList.remove("hidden");

            let selectedModel = document.getElementById("modelSelect").value;
            if (!selectedModel || selectedModel === "waiting") {
                document.getElementById("loadingText").innerText = "Checking valid AI model...";
                selectedModel = await fetchAvailableModels(apiKey);
                if (!selectedModel || selectedModel === "waiting") {
                    alert("Your API Key is invalid. Check Google AI Studio.");
                    resetUI(); return;
                }
            }

            document.getElementById("loadingText").innerText = "Extracting video frame properly...";

            const videoURL = URL.createObjectURL(file);
            const previewVideo = document.getElementById("previewVideo");
            previewVideo.src = videoURL;
            
            // Reset extraction flag for new video
            previewVideo.dataset.extracted = "false";

            previewVideo.onloadedmetadata = () => {
                // Seek to mid of video or 2s (whichever is smaller) to avoid black intro frames
                previewVideo.currentTime = Math.min(2, previewVideo.duration / 2);
            };

            previewVideo.onseeked = async () => {
                // Ensure we only extract the frame ONCE when uploading
                if (previewVideo.dataset.extracted === "true") return;
                previewVideo.dataset.extracted = "true";

                // Add a small 300ms delay to make sure the browser engine has painted the video frame visually
                setTimeout(async () => {
                    const canvas = document.getElementById("hiddenCanvas");
                    canvas.width = previewVideo.videoWidth || 1280; 
                    canvas.height = previewVideo.videoHeight || 720;
                    
                    const ctx = canvas.getContext("2d");
                    // Draw from the REAL preview video element, not a hidden one
                    ctx.drawImage(previewVideo, 0, 0, canvas.width, canvas.height);
                    
                    currentImageBase64 = canvas.toDataURL("image/jpeg", 0.9).split(",")[1]; 
                    
                    const prompt = `You are a YouTube SEO expert. Analyze this video frame. Generate a highly engaging YouTube Title, a detailed SEO optimized description, and comma-separated tags. Return STRICTLY in JSON: {"title": "...", "description": "...", "tags": "..."}`;
                    
                    await callGeminiAPI(prompt, currentImageBase64, selectedModel, apiKey, 0);
                }, 300);
            };
        }

        async function callGeminiAPI(prompt, base64Image, modelName, apiKey, retryCount) {
            const friendlyName = modelName.replace("models/", "");
            document.getElementById("loadingText").innerText = `Sending to ${friendlyName}...`;
            
            const url = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;
            const requestBody = JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } } ] }] });

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: requestBody
                });
                
                const data = await response.json();
                
                if (data.error) {
                    if(data.error.message.includes("high demand") || data.error.message.includes("overloaded") || data.error.message.includes("unavailable")) {
                        const selectEl = document.getElementById("modelSelect");
                        if (retryCount < selectEl.options.length - 1) {
                            let nextIndex = selectEl.selectedIndex + 1;
                            if(nextIndex >= selectEl.options.length) nextIndex = 0; 
                            
                            selectEl.selectedIndex = nextIndex;
                            let nextModel = selectEl.options[nextIndex].value;
                            document.getElementById("loadingText").innerText = `Busy! Switching to ${nextModel.replace("models/","")}...`;
                            
                            return await callGeminiAPI(prompt, base64Image, nextModel, apiKey, retryCount + 1);
                        } else {
                            alert("All AI Models are currently busy! Please wait a few minutes.");
                            resetUI(); return;
                        }
                    } else {
                        alert("API Error: " + data.error.message);
                        resetUI(); return; 
                    }
                }

                let textResponse = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const resultJSON = JSON.parse(textResponse);

                document.getElementById("resTitle").value = resultJSON.title || "";
                document.getElementById("resDesc").value = resultJSON.description || "";
                document.getElementById("resTags").value = resultJSON.tags || "";
                createThumbnail(resultJSON.title || "Awesome Video");

                document.getElementById("loadingIndicator").classList.add("hidden");
                document.getElementById("resultsSection").classList.remove("hidden");
            } catch (error) {
                alert("Network error. Try again.");
                resetUI();
            }
        }

        function createThumbnail(title) {
            const canvas = document.getElementById("thumbnailCanvas");
            const hiddenCanvas = document.getElementById("hiddenCanvas");
            
            canvas.width = 1280; 
            canvas.height = 720;
            const ctx = canvas.getContext("2d");
            
            // Draw the extracted background image
            ctx.drawImage(hiddenCanvas, 0, 0, canvas.width, canvas.height);
            
            // Add a dark gradient at the bottom so white text is readable
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "transparent"); 
            gradient.addColorStop(0.5, "transparent");
            gradient.addColorStop(1, "rgba(0,0,0,0.9)");
            ctx.fillStyle = gradient; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add Title Text
            ctx.fillStyle = "white"; 
            ctx.font = "bold 70px Inter, sans-serif";
            ctx.textAlign = "center"; 
            ctx.shadowColor = "black"; 
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            // Wrap text logic if it's too long
            const maxText = title.substring(0, 45) + (title.length > 45 ? "..." : "");
            ctx.fillText(maxText, canvas.width/2, canvas.height - 80);
        }

        function downloadThumbnail() {
            const link = document.createElement("a");
            link.download = "youtube-thumbnail.jpg";
            link.href = document.getElementById("thumbnailCanvas").toDataURL("image/jpeg");
            link.click();
        }

        async function refineMetadata() {
            const userInst = document.getElementById("chatInput").value;
            if (!userInst) return;
            document.getElementById("loadingIndicator").classList.remove("hidden");
            document.getElementById("resultsSection").classList.add("hidden");
            
            const prompt = `Update this metadata. Instruction: "${userInst}". Current Title: "${document.getElementById("resTitle").value}". Return STRICTLY in JSON: {"title": "...", "description": "...", "tags": "..."}`;
            const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value;
            const selectedModel = document.getElementById("modelSelect").value;
            
            await callGeminiAPI(prompt, currentImageBase64, selectedModel, apiKey, 0);
        }
    </script>
</body>
</html>
